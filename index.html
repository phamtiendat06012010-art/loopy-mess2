<script>
tailwind.config={
theme:{
extend:{
colors:{
loopy:{
100:'#fff0f3',
200:'#ffe4e8',
300:'#fecdd3',
400:'#fda4af',
500:'#f43f5e',
600:'#e11d48',
accent:'#ff758f',
soft:'#fffafb'
}
},
fontFamily:{
sans:['Nunito','sans-serif']
}

<style>
*{
box-sizing:border-box;
}

::-webkit-scrollbar{
width:6px;
height:6px;
}

::-webkit-scrollbar-track{
background:#ffe4e8;
}

::-webkit-scrollbar-thumb{
background:#fda4af;
border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
background:#f43f5e;
}

body{
-webkit-tap-highlight-color:transparent;
}

.loopy-card{
background:rgba(255,255,255,.86);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:2px solid rgba(255,255,255,.8);
}

.glass{
background:rgba(255,255,255,.72);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
}

.sticker-bounce{
transition:.2s;
}

.sticker-bounce:hover{
transform:scale(1.12) rotate(3deg);
}

.emoji-item{
transition:.15s;
cursor:pointer;
}

.emoji-item:hover{
transform:scale(1.35);
background:#fff0f3;
}

.message-in{
animation:messageIn .22s ease-out;
}

@keyframes messageIn{
from{
opacity:0;
transform:translateY(10px) scale(.97);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.pulse-heart{
animation:pulseHeart 1.5s infinite;
}

@keyframes pulseHeart{
0%,100%{transform:scale(1)}
50%{transform:scale(1.08)}
}

.float-heart{
position:fixed;
pointer-events:none;
font-size:18px;
animation:floatHeart 1.4s ease-out forwards;
z-index:100;
}

@keyframes floatHeart{
0%{
opacity:1;
transform:translateY(0) scale(1);
}
100%{
opacity:0;
transform:translateY(-100px) scale(1.6);
}
}

.picker{
animation:pickerIn .18s ease-out;
transform-origin:bottom center;
}

@keyframes pickerIn{
from{
opacity:0;
transform:scale(.95) translateY(8px);
}
to{
opacity:1;
transform:scale(1) translateY(0);
}
}

.tab-active{
background:#ff758f;
color:white;
box-shadow:0 4px 12px rgba(244,63,94,.2);
}

.chat-bg{
background-image:
radial-gradient(circle at 20% 20%,rgba(253,164,175,.13) 0 2px,transparent 3px),
radial-gradient(circle at 80% 70%,rgba(244,63,94,.08) 0 2px,transparent 3px);
background-size:40px 40px,55px 55px;
}

.online-dot{
box-shadow:0 0 0 3px rgba(52,211,153,.15);
}
</style>

const data=e.data;

if(data&&data.senderId!==myRandomId){

if(!isCanvasFallback&&!conn){
enableCanvasFallback('Phát hiện Local Sync giữa các Tab!');
}

appendMessage(
data.content,
'received',
data.type,
data.time,
data.avatar
);

}
};

}

try{

peer=new Peer(myRandomId);

peer.on('open',id=>{

getEl('myIdText').innerText=id;
getEl('statusBadge').innerText='Sẵn sàng kết nối 🌸';

});

peer.on('connection',connection=>{

conn=connection;
setupConnectionHandlers();

showToast('Có người bạn Loopy đã kết nối! 💗');

});

peer.on('error',err=>{

console.warn(err);

if(
err.type==='browser-incompatible'||
err.message?.includes('SecurityError')||
err.message?.includes('WebSocket')
){

enableCanvasFallback(
'Canvas hạn chế WebSocket. Đã chuyển sang Local Sync!'
);

}

});

}catch(e){

enableCanvasFallback(
'Không thể khởi tạo PeerJS. Đã bật Local Sync!'
);

}

}

window.addEventListener('DOMContentLoaded',init);

function renderEmojiCategories(){

const box=getEl('emojiCategories');

box.innerHTML=Object.keys(EMOJIS).map(category=>`

<button
class="px-2.5 py-1.5 rounded-xl text-sm hover:bg-pink-100 shrink-0 ${category===currentEmojiCategory?'bg-pink-100':''}"
onclick="selectEmojiCategory('${category}')">
${category}
</button>

`).join('');

}

function selectEmojiCategory(category){

currentEmojiCategory=category;

renderEmojiCategories();
renderEmojiGrid();

}

function renderEmojiGrid(list=null){

const grid=getEl('emojiGrid');

const emojis=list||EMOJIS[currentEmojiCategory];

grid.innerHTML=emojis.map(emoji=>`

<button
class="emoji-item rounded-xl p-2 text-2xl"
onclick="insertEmoji('${emoji}')">
${emoji}
</button>

`).join('');

}

function searchEmoji(value){

value=value.toLowerCase().trim();

if(!value){

renderEmojiGrid();
return;

}

const all=[].concat(...Object.values(EMOJIS));

const unique=[...new Set(all)];

const result=unique.filter(x=>x.toLowerCase().includes(value));

renderEmojiGrid(result);

}

function insertEmoji(emoji){

const input=getEl('messageInput');

if(!input||input.disabled)return;

input.value+=emoji;
input.focus();

}

function renderStickers(){

const grid=getEl('stickerGrid');

grid.innerHTML='';

STICKERS.forEach((sticker,index)=>{

const button=document.createElement('button');

button.className=
'p-2 rounded-2xl hover:bg-pink-100 border border-pink-100 text-4xl sticker-bounce';

button.innerText=sticker;

button.onclick=()=>sendSticker(sticker);

grid.appendChild(button);

});

}

function switchPicker(type){

const emojiPanel=getEl('emojiPanel');
const stickerPanel=getEl('stickerPanel');

const emojiTab=getEl('emojiTab');
const stickerTab=getEl('stickerTab');

if(type==='emoji'){

emojiPanel.classList.remove('hidden');
stickerPanel.classList.add('hidden');

emojiTab.classList.add('tab-active');
stickerTab.classList.remove('tab-active');

}else{

emojiPanel.classList.add('hidden');
stickerPanel.classList.remove('hidden');

emojiTab.classList.remove('tab-active');
stickerTab.classList.add('tab-active');

}

}

function togglePicker(){

const picker=getEl('picker');

picker.classList.toggle('hidden');

}

document.addEventListener('click',e=>{

const picker=getEl('picker');
const btn=getEl('pickerBtn');

if(
picker &&
!picker.contains(e.target) &&
btn &&
!btn.contains(e.target)
){

picker.classList.add('hidden');

}

});

function openAvatarModal(){

getEl('avatarModal').classList.remove('hidden');

const input=getEl('avatarUrlInput');

input.value=
myAvatarUrl.startsWith('http')?
myAvatarUrl:'';

}

function closeAvatarModal(){

getEl('avatarModal').classList.add('hidden');

}

function setAvatarFromPreset(value){

saveAndSetAvatar(value);
closeAvatarModal();

}

function applyCustomAvatarUrl(){

const value=getEl('avatarUrlInput').value.trim();

if(!value){

showToast('Vui lòng nhập URL ảnh!');
return;

}

if(!/^https?:\/\/.+/i.test(value)){

showToast('URL ảnh không hợp lệ!');
return;

}

saveAndSetAvatar(value);
closeAvatarModal();

}

function saveAndSetAvatar(value){

myAvatarUrl=value;

localStorage.setItem('loopy_avatar',value);

updateAvatarUI(value);

showToast('Đã đổi Avatar! 🌸');

}

function updateAvatarUI(value){

const display=getEl('myAvatarDisplay');

if(value.startsWith('http')){

display.innerHTML='';

const img=document.createElement('img');

img.src=value;
img.className='w-full h-full object-cover';

img.onerror=()=>{

display.innerText='🎀';

};

display.appendChild(img);

}else{

display.innerText=value;

}

}

function enableCanvasFallback(reason){

if(isCanvasFallback)return;

isCanvasFallback=true;

getEl('myIdText').innerText=myRandomId;

getEl('canvasNoticeBanner').classList.remove('hidden');
getEl('canvasNoticeBanner').classList.add('flex');

getEl('noticeMsg').innerText=reason;

getEl('statusBadge').innerText='Local Sync 🌸';
getEl('statusBadge').className='text-xs text-amber-500 font-bold';

getEl('chatHeaderTitle').innerText='Loopy Local Sync';
getEl('chatHeaderSub').innerText='Chat giữa các Tab 🌸';

getEl('partnerCard').classList.remove('hidden');
getEl('partnerCard').classList.add('flex');

getEl('emptyPartnerState').classList.add('hidden');

toggleInputState(true);

showToast('Đã bật Local Sync! 🌸');

}

function connectToFriend(){

const input=getEl('friendIdInput');

const id=input.value.trim();

if(!id){

showToast('Vui lòng nhập Mã ID!');
return;

}

if(id===myRandomId){

showToast('Không thể kết nối với chính mình!');
return;

}

if(isCanvasFallback||!peer){

showToast('Local Sync không dùng ID P2P. Hãy mở Tab mới!');
return;

}

getEl('statusBadge').innerText='Đang kết nối...';

conn=peer.connect(id);

conn.on('open',()=>{

setupConnectionHandlers();

showToast('Kết nối thành công! 💗');

});

conn.on('error',()=>{

showToast('Không tìm thấy ID!');

getEl('statusBadge').innerText='Sẵn sàng kết nối 🌸';

});

}

function setupConnectionHandlers(){

if(!conn)return;

const id=conn.peer;

getEl('chatHeaderTitle').innerText=id;
getEl('chatHeaderSub').innerText='Đang trực tuyến 🌸';

getEl('partnerIdText').innerText=id;

getEl('partnerCard').classList.remove('hidden');
getEl('partnerCard').classList.add('flex');

getEl('emptyPartnerState').classList.add('hidden');

toggleInputState(true);

conn.on('data',data=>{

appendMessage(
data.content,
'received',
data.type,
data.time,
data.avatar
);

});

conn.on('close',()=>{

getEl('chatHeaderSub').innerText='Đã ngắt kết nối';

getEl('partnerCard').classList.add('hidden');
getEl('emptyPartnerState').classList.remove('hidden');

toggleInputState(false);

showToast('Đối phương đã ngắt kết nối.');

});

}

function toggleInputState(enable){

[
'messageInput',
'sendBtn',
'uploadBtn',
'pickerBtn'
].forEach(id=>{

const el=getEl(id);

if(!el)return;

el.disabled=!enable;
el.style.opacity=enable?'1':'.5';

});

}

function handleInputKey(event){

if(event.key==='Enter'){

event.preventDefault();

sendTextMessage();

}

}

function sendData(data){

if(isCanvasFallback||!conn){

if(broadcastChannel){

broadcastChannel.postMessage({
senderId:myRandomId,
...data
});

}

return;

}

if(conn.open){

conn.send(data);

}

}

function sendTextMessage(){

const input=getEl('messageInput');

const text=input.value.trim();

if(!text)return;

const data={
type:'text',
content:text,
time:getCurrentTime(),
avatar:myAvatarUrl
};

sendData(data);

appendMessage(
text,
'sent',
'text',
data.time,
myAvatarUrl
);

input.value='';

createFloatingHeart();

}

function sendSticker(sticker){

const data={
type:'sticker',
content:sticker,
time:getCurrentTime(),
avatar:myAvatarUrl
};

sendData(data);

appendMessage(
sticker,
'sent',
'sticker',
data.time,
myAvatarUrl
);

getEl('picker').classList.add('hidden');

}

function sendImage(input){

if(!input.files||!input.files[0])return;

const file=input.files[0];

if(file.size>5*1024*1024){

showToast('Ảnh tối đa 5MB!');
input.value='';
return;

}

const reader=new FileReader();

reader.onload=e=>{

const data={
type:'image',
content:e.target.result,
time:getCurrentTime(),
avatar:myAvatarUrl
};

sendData(data);

appendMessage(
data.content,
'sent',
'image',
data.time,
myAvatarUrl
);

};

reader.readAsDataURL(file);

input.value='';

}

function appendMessage(content,direction,type,time,avatar){

const chat=getEl('chatBox');

const welcome=getEl('welcomeMessage');

if(welcome)welcome.remove();

const wrapper=document.createElement('div');

const sent=direction==='sent';

wrapper.className=
`flex gap-2 ${sent?'flex-row-reverse':'flex-row'} items-end my-1 message-in`;

const avatarDiv=document.createElement('div');

avatarDiv.className=
'w-8 h-8 rounded-xl bg-pink-200 border border-white flex items-center justify-center overflow-hidden shrink-0 text-sm shadow-sm';

const userAvatar=avatar||(sent?myAvatarUrl:'🌸');

if(userAvatar.startsWith('http')){

const img=document.createElement('img');

img.src=userAvatar;
img.className='w-full h-full object-cover';

img.onerror=()=>{
avatarDiv.innerText='🌸';
};

avatarDiv.appendChild(img);

}else{

avatarDiv.innerText=userAvatar;

}

const container=document.createElement('div');

container.className=
`flex flex-col ${sent?'items-end':'items-start'} space-y-1 max-w-[80%]`;

if(type==='text'){

const bubble=document.createElement('div');

bubble.className=sent?
'bg-gradient-to-r from-pink-400 to-rose-400 text-white rounded-2xl rounded-tr-sm border-2 border-white px-4 py-2.5 text-xs md:text-sm font-bold break-words shadow-sm':
'bg-white text-pink-900 border-2 border-pink-200 rounded-2xl rounded-tl-sm px-4 py-2.5 text-xs md:text-sm font-bold break-words shadow-sm';

bubble.innerText=content;

container.appendChild(bubble);

}

else if(type==='image'){

const box=document.createElement('div');

box.className=
'bg-white border-2 border-pink-200 p-1.5 rounded-2xl shadow-sm';

const img=document.createElement('img');

img.src=content;
img.className='rounded-xl max-h-60 max-w-xs object-cover';

box.appendChild(img);
container.appendChild(box);

}

else if(type==='sticker'){

const sticker=document.createElement('div');

sticker.className=
'text-7xl md:text-8xl drop-shadow-md sticker-bounce';

sticker.innerText=content;

container.appendChild(sticker);

}

const timestamp=document.createElement('span');

timestamp.className=
'text-[10px] font-bold text-pink-400 px-1';

timestamp.innerText=time;

container.appendChild(timestamp);

wrapper.appendChild(avatarDiv);
wrapper.appendChild(container);

chat.appendChild(wrapper);

chat.scrollTop=chat.scrollHeight;

}

function clearInput(){

getEl('messageInput').value='';

getEl('messageInput').focus();

}

function clearChat(){

if(!confirm('Xóa toàn bộ tin nhắn trên màn hình?'))return;

getEl('chatBox').innerHTML=`

<div id="welcomeMessage" class="text-center py-5 px-4 text-xs text-pink-400 font-bold bg-white/70 rounded-3xl border-2 border-pink-200 max-w-md mx-auto my-auto shadow-sm">

<div class="text-4xl mb-2">
🌸💗🌷
</div>

<div class="text-pink-600 font-extrabold text-sm mb-1">
Loopy Messenger
</div>

Tin nhắn đã được xóa khỏi màn hình.

</div>

`;

}

function getCurrentTime(){

const now=new Date();

return now.getHours().toString().padStart(2,'0')+
':'+
now.getMinutes().toString().padStart(2,'0');

}

function copyMyId(){

const id=getEl('myIdText').innerText;

if(!id||id.includes('...'))return;

navigator.clipboard.writeText(id)
.then(()=>{
showToast('Đã copy Mã ID! 💗');
})
.catch(()=>{

const input=document.createElement('input');

input.value=id;

document.body.appendChild(input);

input.select();

document.execCommand('copy');

input.remove();

showToast('Đã copy Mã ID! 💗');

});

}

function openInNewTab(){

window.open(window.location.href,'_blank');

}

function showToast(message){

const toast=getEl('toast');

getEl('toastMsg').innerText=message;

toast.classList.remove(
'translate-y-[-100px]',
'opacity-0'
);

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(()=>{

toast.classList.add(
'translate-y-[-100px]',
'opacity-0'
);

},3000);

}

function createFloatingHeart(){

const heart=document.createElement('div');

heart.className='float-heart';

heart.innerText=[
'💗','💖','💕','💞','🌸','✨','🎀'
][Math.floor(Math.random()*7)];

heart.style.left=
Math.random()*90+5+'%';

heart.style.bottom='90px';

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),1500);

}

</script>
